name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build USER (root)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          OWNER='${{ github.repository_owner }}'
          REPO_NAME='${{ github.event.repository.name }}'
          if [[ "${REPO_NAME}" == "${OWNER}.github.io" ]]; then
            export BASE_HREF="/"
          else
            export BASE_HREF="/${REPO_NAME}/"
          fi
          ./scripts/build_user_web.sh

          mkdir -p site
          cp -R build/web/. site/
          cp site/index.html site/404.html

      - name: Build ADMIN (/admin)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          OWNER='${{ github.repository_owner }}'
          REPO_NAME='${{ github.event.repository.name }}'
          if [[ "${REPO_NAME}" == "${OWNER}.github.io" ]]; then
            export BASE_HREF="/admin/"
          else
            export BASE_HREF="/${REPO_NAME}/admin/"
          fi
          ./scripts/build_admin_web.sh

          mkdir -p site/admin
          cp -R build/web/. site/admin/
          cp site/admin/index.html site/admin/404.html

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

