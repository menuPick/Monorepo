name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/deploy_server.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN repository variable}"
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          deploy_command="$(cat <<'COMMAND'
          sudo -iu ubuntu bash <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/ubuntu/Monorepo

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Deployment aborted: EC2 checkout has uncommitted changes." >&2
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            backup="deploy-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            git branch "$backup" HEAD
            echo "Saved diverged EC2 commits to $backup"
          fi

          git reset --hard origin/main
          cd server
          mvn -q test
          mvn -q -DskipTests package
          REMOTE_SCRIPT
          COMMAND
          )"

          parameters="$(jq -n --arg deploy "$deploy_command" '{
            commands: [
              "set -euo pipefail",
              $deploy,
              "systemctl restart menupick",
              "systemctl is-active --quiet menupick",
              "curl --fail --silent --show-error http://localhost/health"
            ]
          }')"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MenuPick server from GitHub Actions" \
            --parameters "$parameters" \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command ID: $command_id"

          status="Pending"
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          test "$status" = "Success"
